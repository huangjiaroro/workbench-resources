format: 3
id: comfyui
version: 1.0.7
name: ComfyUI
description: 连接 ComfyUI 服务，支持全能多模态参考生视频 (h3-flex/h3)、首尾帧生视频 (h3-flex-fl) 以及 MiniMax Music 3 音乐生成，支持任务恢复与结果下载。
docs: WORKBENCH-TOOLS.md
entrypoints:
  - id: cli
    path: comfy.mjs
    interpreter: node
    description: 通过已准备的原生命令执行，参数与输出见说明。
    args: []
prepare:
  path: setup.mjs
  interpreter: node
  timeoutSeconds: 120
commands:
  - name: zp-comfy
    path: comfy.mjs
    interpreter: node
dependencies: []
configuration:
  schema:
    type: object
    additionalProperties: false
    properties:
      endpoint:
        type: string
        title: ComfyUI 服务地址
        minLength: 1
        default: http://127.0.0.1:8188
      apiKey:
        type: string
        title: 认证 Key（可选）
        writeOnly: true
    required:
      - endpoint
ui: []
recommendedSkills: []
skills:
  - skills/comfyui-operations
