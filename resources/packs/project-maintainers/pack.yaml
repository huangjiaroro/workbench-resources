id: project-maintainers
version: 2.2.0
workMode: conversations
name: 项目维护者
playbook: playbook.md
employees:
  - role: leader
    skills:
      - id: memory-management
      - id: workbench-resource-authoring
    name: 组织维护负责人
    definition: { id: organization-maintainer, version: 1.8.0 }
    canDelegate: true
    maintenancePermissions:
      [config.read, config.write, config.admin, diagnosis.read, resource.install]
  - role: skill-engineer
    skills:
      - id: memory-management
      - id: workbench-resource-authoring
    name: 技能工程师
    definition: { id: skill-engineer, version: 1.6.0 }
    canDelegate: false
    maintenancePermissions: [config.read, diagnosis.read, resource.install]
  - role: plugin-engineer
    skills:
      - id: memory-management
      - id: workbench-resource-authoring
    name: 插件工程师
    definition: { id: plugin-engineer, version: 1.1.0 }
    canDelegate: false
    maintenancePermissions: [config.read, diagnosis.read, resource.install]
  - role: diagnostician
    skills:
      - id: memory-management
    name: 运行诊断员
    definition: { id: runtime-diagnostician, version: 1.4.0 }
    canDelegate: false
    maintenancePermissions: [config.read, diagnosis.read]
