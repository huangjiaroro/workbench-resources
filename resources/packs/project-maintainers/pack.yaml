id: project-maintainers
version: 2.3.0
workMode: conversations
name: 项目维护者
playbook: playbook.md
employees:
  - role: leader
    skills:
      - id: memory-management
      - id: workbench-resource-authoring
    name: 组织维护负责人
    definition: { id: organization-maintainer, version: 1.9.0 }
    canDelegate: true
    maintenancePermissions:
      [config.read, config.write, config.admin, diagnosis.read, resource.install]
  - role: resource-maintainer
    name: 组织资源维护员
    definition: { id: organization-resource-maintainer, version: 1.0.0 }
    canDelegate: false
    maintenancePermissions: [config.read, diagnosis.read]
  - role: diagnostician
    skills:
      - id: memory-management
    name: 运行诊断员
    definition: { id: runtime-diagnostician, version: 1.4.0 }
    canDelegate: false
    maintenancePermissions: [config.read, diagnosis.read]
  - role: resource-publisher
    name: 资源发布员
    definition: { id: resource-publisher, version: 1.0.0 }
    canDelegate: false
    maintenancePermissions: [config.read, config.write, resource.install]
