version: '3.2.1'
kinds:
  task-context: { name: 任务共同背景, path: 'tasks/{taskId}/context.md' }
  work-order: { name: 员工工单, path: 'tasks/{taskId}/work-orders/{workOrderId}.md' }
  campaign-brief: { name: 推广目标与约束, path: 'campaigns/{campaignId}/brief.md' }
  market-research: { name: 市场研究结论与依据, path: 'campaigns/{campaignId}/research/{topic}.md' }
  promotion-plan: { name: 宣传策略与创意需求, path: 'campaigns/{campaignId}/strategy/plan.md' }
  promo-package:
    { name: 媒体素材登记及实际文件引用, path: 'campaigns/{campaignId}/materials/{materialId}.md' }
  channel-record: { name: 渠道计划、发布状态与回执, path: 'campaigns/{campaignId}/channels/{channel}.md' }
  distribution-plan: { name: 发行渠道与商务资料, path: 'campaigns/{campaignId}/distribution/plan.md' }
  growth-report: { name: 指标、分析与效果复盘, path: 'campaigns/{campaignId}/analytics/{reportId}.md' }
  ad-test: { name: 付费测试方案与执行记录, path: 'campaigns/{campaignId}/ads/{experimentId}.md' }
  revenue-model: { name: 收益场景及结算核对, path: 'campaigns/{campaignId}/monetization/{modelId}.md' }
  compliance-review: { name: 独立审查记录, path: 'campaigns/{campaignId}/reviews/{subjectId}.md' }
  campaign-report: { name: 活动阶段成果, path: 'campaigns/{campaignId}/reports/{reportId}.md' }
